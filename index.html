<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Huma Traders Admin</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      function App() {
        const [activeTab, setActiveTab] = useState('pos');
        const [items] = useState([
          { id: 1, name: 'Toor Dal (Loose)', price: 135, unit: 'kg', stock: 250 },
          { id: 2, name: 'Sugar (Mandi Special)', price: 42, unit: 'kg', stock: 500 },
          { id: 3, name: 'Groundnut Oil (15L)', price: 2450, unit: 'tin', stock: 40 },
          { id: 4, name: 'Wheat Lokwan', price: 38, unit: 'kg', stock: 1200 }
        ]);
        const [cart, setCart] = useState([]);

        const addToCart = (item) => {
          const existing = cart.find(c => c.id === item.id);
          if (existing) {
            setCart(cart.map(c => c.id === item.id ? { ...c, qty: c.qty + 1 } : c));
          } else {
            setCart([...cart, { ...item, qty: 1 }]);
          }
        };

        const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

        return (
          <div className="min-h-screen bg-gray-100 text-gray-800 font-sans">
            <header className="bg-emerald-700 text-white p-4 shadow-md flex justify-between items-center">
              <div>
                <h1 className="text-xl font-bold">HUMA TRADERS - Solapur</h1>
                <p className="text-xs text-emerald-200">Wholesale Grocery & POS Admin System</p>
              </div>
            </header>

            <nav className="bg-white border-b flex justify-around p-2 text-sm font-medium">
              <button 
                onClick={() => setActiveTab('pos')} 
                className={`p-2 rounded-lg ${activeTab === 'pos' ? 'bg-emerald-100 text-emerald-800 font-bold' : 'text-gray-600'}`}
              >
                🛒 POS Counter
              </button>
              <button 
                onClick={() => setActiveTab('inventory')} 
                className={`p-2 rounded-lg ${activeTab === 'inventory' ? 'bg-emerald-100 text-emerald-800 font-bold' : 'text-gray-600'}`}
              >
                📦 Inventory & Mandi
              </button>
            </nav>

            <main className="p-4 max-w-4xl mx-auto">
              {activeTab === 'pos' && (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="bg-white p-4 rounded-xl shadow-sm border">
                    <h2 className="font-bold text-gray-700 mb-3">📦 Available Items</h2>
                    <div className="grid grid-cols-1 gap-2">
                      {items.map(item => (
                        <div key={item.id} className="flex justify-between items-center p-3 border rounded-lg">
                          <div>
                            <p className="font-semibold text-sm">{item.name}</p>
                            <p className="text-xs text-gray-500">₹{item.price}/{item.unit}</p>
                          </div>
                          <button onClick={() => addToCart(item)} className="bg-emerald-600 text-white px-3 py-1 rounded-lg text-sm">
                            + Add
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="bg-white p-4 rounded-xl shadow-sm border flex flex-col justify-between">
                    <div>
                      <h2 className="font-bold text-gray-700 mb-3">🧾 Current Bill</h2>
                      {cart.length === 0 ? (
                        <p className="text-xs text-gray-400">Cart is empty.</p>
                      ) : (
                        cart.map(c => (
                          <div key={c.id} className="flex justify-between text-sm border-b pb-1 mb-1">
                            <span>{c.name} x {c.qty}</span>
                            <span className="font-semibold">₹{c.price * c.qty}</span>
                          </div>
                        ))
                      )}
                    </div>
                    {cart.length > 0 && (
                      <div className="border-t pt-3 mt-4">
                        <div className="flex justify-between font-bold text-lg mb-3">
                          <span>Total:</span>
                          <span className="text-emerald-700">₹{totalAmount}</span>
                        </div>
                        <button onClick={() => alert("Printing Bill...")} className="w-full bg-emerald-600 text-white py-3 rounded-lg font-bold">
                          🖨️ Print Thermal Bill
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </main>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
